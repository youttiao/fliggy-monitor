<nav class="nav">
    <a href="/" class="nav-brand">
        <span class="dot"></span>
        飞猪哨兵 <span class="accent">·</span> Sentinel
    </a>
    <div class="nav-links">
        <a href="/" class="nav-link {% if current_path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/sellers" class="nav-link {% if current_path.startswith('/sellers') %}active{% endif %}">卖家</a>
        <a href="/alerts" class="nav-link {% if current_path.startswith('/alerts') %}active{% endif %}">告警</a>
        <a href="/settings" class="nav-link {% if current_path.startswith('/settings') %}active{% endif %}">设置</a>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-meta">
        {% include 'partials/_cookie_indicator.html' %}
        <span class="pill" title="监控轮询间隔">
            <span style="color:var(--text-2)">每</span>
            <span>{{ (site.polling_sec if site and site.polling_sec else 1800) // 60 }}</span>
            <span style="color:var(--text-2)">min</span>
        </span>

        {# ── 主题切换：3 段 segmented（auto / light / dark）── #}
        <div class="theme-toggle" role="group" aria-label="主题">
            <button type="button" class="theme-opt" data-theme-set="auto" aria-label="跟随系统" title="跟随系统">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="1.75" y="2.5" width="12.5" height="8.5" rx="1.2"/>
                    <path d="M5.75 13h4.5"/>
                    <path d="M8 11.5V13"/>
                </svg>
            </button>
            <button type="button" class="theme-opt" data-theme-set="light" aria-label="浅色" title="浅色">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="8" cy="8" r="2.7"/>
                    <path d="M8 1.5v1.6"/>
                    <path d="M8 12.9v1.6"/>
                    <path d="M2.2 8H.6"/>
                    <path d="M15.4 8h-1.6"/>
                    <path d="M3.6 3.6 2.4 2.4"/>
                    <path d="M13.6 13.6l-1.2-1.2"/>
                    <path d="M3.6 12.4l-1.2 1.2"/>
                    <path d="M13.6 2.4l-1.2 1.2"/>
                </svg>
            </button>
            <button type="button" class="theme-opt" data-theme-set="dark" aria-label="深色" title="深色">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M13.6 9.5c-.7 2.7-3.2 4.7-6.1 4.7-3.5 0-6.3-2.8-6.3-6.3 0-2.9 2-5.4 4.7-6.1-.5 1-.8 2.1-.8 3.3 0 3.6 2.9 6.5 6.5 6.5.7 0 1.4-.1 2-.3z"/>
                </svg>
            </button>
        </div>

        <form method="post" action="/logout">
            <button type="submit">登出</button>
        </form>
    </div>
</nav>
