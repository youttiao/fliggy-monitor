{% extends "base.html" %}
{% block title %}登录{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <h1>
            <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--phosphor);box-shadow:0 0 8px rgba(79,208,184,0.6)"></span>
            飞猪哨兵 <span class="accent">·</span> Sentinel
        </h1>
        <p class="sub">内部 dashboard · 请用监控账号登录</p>

        {% if error %}
        <div class="err">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" autocomplete="off">
            <input type="hidden" name="next" value="{{ next or '/' }}">
            <div class="field">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required autofocus
                       placeholder="请输入监控密码">
            </div>
            <button class="btn" type="submit" style="width:100%;justify-content:center;">登录</button>
            {% if locked_for and locked_for > 0 %}
            <p class="locked">⚠ 已锁定，请 {{ locked_for }}s 后重试</p>
            {% endif %}
        </form>

        <p class="hint">v1 · 单一密码 · 失败 5 次/10 分钟锁定</p>
    </div>
</div>
{% endblock %}
