[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["fliggy-vps-handover", "data", "backups", ".venv"]

[tool.ruff.lint]
# Strict on bugs/security, lenient on style and FastAPI idioms
select = ["E", "F", "W", "I", "B", "S"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "B007",  # unused loop var `i` is fine for index-style iteration
    "B904",  # raise from is fine in our codebase
    "TRY401",  # redundant exception in log.exception (we sometimes want both)
    "BLE001",  # blind except is fine at boundaries (lifespan teardown, webhook sender)
    "E501",  # line length already enforced by line-length setting; suppress per-line when needed
    "E701",  # legacy compact code; ok to leave for now
    "S104",  # 0.0.0.0 binding is fine for our deploy (we bind 127.0.0.1 in systemd)
    "S105",  # hardcoded "xuran888" password by design (v1 simplification)
    "S106",  # same as above
    "S110",  # try/except/pass in lifespan teardown is intentional (don't log shutdown noise)
    "S311",  # random is fine for seed/test data
    "S324",  # md5/sha1 used for dedup hashes, not security-sensitive
    "S603",  # subprocess call: mtop_client calls curl with controlled args
    "S608",  # SQL: we use ? placeholders; the dynamic WHERE is built from a fixed list, not user input
    "W292",  # trailing newline not enforced in this codebase
    "E402",  # module-level imports not at top (intentional for sys.path manipulation)
]
per-file-ignores = {
    "scripts/*" = ["S", "T", "F"],  # ops scripts can be loose
    "tests/*" = ["S", "B"],
    "web/routes/pages.py" = ["F821"],  # JSONResponse used in forward ref; ruff can't see local import
    "web/auth.py" = ["F821"],  # same: RedirectResponse in string annotation
}

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]